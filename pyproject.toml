[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxdose"
version = "2.0.2"
description = "Vocal exposure analysis, longitudinal comparison and research workspace"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Tiago Lima Bicalho Cruz"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.13,<1", "praat-parselmouth>=0.4.6,<0.5", "PySide6>=6.8,<7", "matplotlib>=3.9,<4", "pandas>=2.2,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]
build = ["pyinstaller>=6", "pillow>=10"]

[project.urls]
Repository = "https://github.com/tiagolbc/VoxDose"
Documentation = "https://github.com/tiagolbc/VoxDose/tree/main/docs"

[project.scripts]
voxdose = "voxdose.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxdose*"]

[tool.setuptools.package-data]
voxdose = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
